<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Maths Hub | Lectures & Solutions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0f0f12;
      color: #eceef2;
      line-height: 1.5;
      padding: 2rem 1.5rem;
    }

    /* refined dark theme with subtle depth */
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* header styling */
    .hero {
      margin-bottom: 2.5rem;
      text-align: center;
      border-bottom: 1px solid #2c2c32;
      padding-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #F0A6B6, #E786A9);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: #a0a3b5;
      font-size: 1.1rem;
      font-weight: 450;
    }

    /* two-column layout — clean & symmetrical */
    .materials-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .column {
      flex: 1;
      min-width: 280px;
      background: #16161c;
      border-radius: 1.5rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(0px);
      border: 1px solid #2a2a30;
    }

    .column:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.5);
      border-color: #E786A9;
    }

    /* column headers with accent */
    .column-header {
      background: #1e1e26;
      padding: 1.2rem 1.5rem;
      border-bottom: 2px solid #E786A9;
    }

    .column-header h2 {
      font-size: 1.6rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #f0f0f4;
    }

    .column-header h2 span {
      background: #E786A9;
      color: #0f0f12;
      font-size: 1rem;
      font-weight: 700;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
    }

    .lecture-list {
      display: flex;
      flex-direction: column;
      padding: 0.75rem 0rem 1.25rem 0rem;
    }

    /* modern card-like items */
    .material-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1d1d25;
      margin: 0.5rem 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 1rem;
      transition: all 0.2s;
      border: 1px solid #2c2c34;
      cursor: pointer;
    }

    .material-card:hover {
      background: #24242e;
      border-color: #E786A9;
      transform: translateX(4px);
    }

    .card-left {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .week-badge {
      background: #2d2d38;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #cfd1e6;
      font-family: monospace;
    }

    .file-name {
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      background: none;
      letter-spacing: -0.2px;
    }

    .file-ext {
      font-family: monospace;
      font-size: 0.7rem;
      background: #2c2c36;
      padding: 0.15rem 0.45rem;
      border-radius: 20px;
      color: #c0c2da;
      margin-left: 0.5rem;
    }

    .download-icon {
      color: #a4a7c2;
      font-size: 0.9rem;
      transition: color 0.2s;
      font-weight: 500;
      opacity: 0.8;
    }

    .material-card:hover .download-icon {
      color: #E786A9;
      opacity: 1;
    }

    a {
      text-decoration: none;
      display: block;
      width: 100%;
    }

    /* subtle footer note */
    .info-note {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.85rem;
      color: #6c6f86;
      border-top: 1px solid #26262e;
      padding-top: 2rem;
    }

    .info-note a {
      display: inline-block;
      color: #E786A9;
      text-decoration: none;
    }

    /* responsiveness */
    @media (max-width: 780px) {
      body {
        padding: 1.2rem;
      }
      .hero h1 {
        font-size: 2rem;
      }
      .column-header h2 {
        font-size: 1.3rem;
      }
      .material-card {
        padding: 0.7rem 1rem;
        flex-wrap: wrap;
      }
      .card-left {
        gap: 0.5rem;
      }
    }

    @media (max-width: 640px) {
      .materials-grid {
        flex-direction: column;
        gap: 1.5rem;
      }
    }

    /* empty state not needed, but smooth */
    .material-card.empty {
      opacity: 0.6;
      justify-content: center;
      font-style: italic;
      color: #8f92aa;
      background: #18181e;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>📐 Maths Course Vault</h1>
    <p>Weekly lectures & full solutions — perfectly organized</p>
  </div>

  <div class="materials-grid">
    <!-- LEFT COLUMN: LECTURES (l1.pdf ... l10.pdf) -->
    <div class="column">
      <div class="column-header">
        <h2><span>📖</span> Lectures</h2>
      </div>
      <div class="lecture-list" id="lectureColumn">
        <!-- JavaScript will populate dynamic rows for l1.pdf to l10.pdf -->
      </div>
    </div>

    <!-- RIGHT COLUMN: SOLUTIONS (l1s.pdf ... l10s.pdf) -->
    <div class="column">
      <div class="column-header">
        <h2><span>✅</span> Solutions</h2>
      </div>
      <div class="lecture-list" id="solutionsColumn">
        <!-- Solutions: l1s.pdf to l10s.pdf -->
      </div>
    </div>
  </div>
  <div class="info-note">
    <span>📁 All materials open in new tab — files follow naming: <strong>l<em>N</em>.pdf</strong> (lecture) & <strong>l<em>N</em>s.pdf</strong> (solutions)</span><br>
    <span style="font-size:0.75rem;">✨ Perfect for 10 weeks of content | Auto-generated resource links</span>
  </div>
</div>

<script>
  (function() {
    // Total weeks: 10 (lecture numbers 1 through 10)
    const TOTAL_WEEKS = 10;
    
    // Helper function: generate display name with clear week reference
    // For lecture: "Lecture 1: Core notes"
    // but we keep it simple but professional: "Lecture 1" + file indicator
    function getLectureDisplayName(weekNum) {
      return `Lecture ${weekNum}`;
    }
    
    function getSolutionDisplayName(weekNum) {
      return `Solutions ${weekNum}`;
    }
    
    // Build HTML for lecture column (l1.pdf .. l10.pdf)
    const lectureContainer = document.getElementById('lectureColumn');
    const solutionsContainer = document.getElementById('solutionsColumn');
    
    if (!lectureContainer || !solutionsContainer) return;
    
    // Clear any placeholders (just to be safe)
    lectureContainer.innerHTML = '';
    solutionsContainer.innerHTML = '';
    
    // Create lecture items
    for (let i = 1; i <= TOTAL_WEEKS; i++) {
      const lectureHref = `l${i}.pdf`;
      const lectureName = getLectureDisplayName(i);
      
      // Build card element
      const card = document.createElement('div');
      card.className = 'material-card';
      
      // inner structure
      const leftDiv = document.createElement('div');
      leftDiv.className = 'card-left';
      
      const weekBadge = document.createElement('span');
      weekBadge.className = 'week-badge';
      weekBadge.textContent = `Week ${i}`;
      
      const fileNameSpan = document.createElement('span');
      fileNameSpan.className = 'file-name';
      fileNameSpan.textContent = lectureName;
      
      const extSpan = document.createElement('span');
      extSpan.className = 'file-ext';
      extSpan.textContent = '.pdf';
      
      leftDiv.appendChild(weekBadge);
      leftDiv.appendChild(fileNameSpan);
      leftDiv.appendChild(extSpan);
      
      const iconSpan = document.createElement('span');
      iconSpan.className = 'download-icon';
      iconSpan.innerHTML = '↗'; // subtle open arrow
      
      card.appendChild(leftDiv);
      card.appendChild(iconSpan);
      
      // Create anchor wrapper to make whole card clickable (better UX)
      const anchor = document.createElement('a');
      anchor.href = lectureHref;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.setAttribute('aria-label', `Open ${lectureName} PDF`);
      // replace card content with anchor enclosing
      anchor.appendChild(card.cloneNode(true));
      
      // clear original card and use anchored version
      lectureContainer.appendChild(anchor);
    }
    
    // Create solutions column (l1s.pdf .. l10s.pdf)
    for (let i = 1; i <= TOTAL_WEEKS; i++) {
      const solutionHref = `l${i}s.pdf`;
      const solutionName = getSolutionDisplayName(i);
      
      const card = document.createElement('div');
      card.className = 'material-card';
      
      const leftDiv = document.createElement('div');
      leftDiv.className = 'card-left';
      
      const weekBadge = document.createElement('span');
      weekBadge.className = 'week-badge';
      weekBadge.textContent = `Week ${i}`;
      
      const fileNameSpan = document.createElement('span');
      fileNameSpan.className = 'file-name';
      fileNameSpan.textContent = solutionName;
      
      const extSpan = document.createElement('span');
      extSpan.className = 'file-ext';
      extSpan.textContent = '.pdf';
      
      leftDiv.appendChild(weekBadge);
      leftDiv.appendChild(fileNameSpan);
      leftDiv.appendChild(extSpan);
      
      const iconSpan = document.createElement('span');
      iconSpan.className = 'download-icon';
      iconSpan.innerHTML = '↗';
      
      card.appendChild(leftDiv);
      card.appendChild(iconSpan);
      
      const anchor = document.createElement('a');
      anchor.href = solutionHref;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      anchor.setAttribute('aria-label', `Open ${solutionName} PDF`);
      anchor.appendChild(card.cloneNode(true));
      
      solutionsContainer.appendChild(anchor);
    }
    
    // Optional: add a tiny visual accent for responsive interaction
    // No extra empty items needed, exactly 10+10 items.
    // For extra polish, we can also add a note if a file is missing? but not required.
    // However to mirror the design consistency, we ensure columns have same height-like appearance.
    
    // append subtle separator in both columns for visual balance? not needed, but if there is less content both are equal.
    // For edge cases (just ensures both columns have same card count, which they do: 10 each)
    // We also set a fallback if some weeks were extended — but clearly 10 weeks.
    
    // To improve semantics: add a small style for anchors to remove default underline, preserve block
    const styleTag = document.createElement('style');
    styleTag.textContent = `
      a, a:visited, a:hover, a:active {
        text-decoration: none;
        color: inherit;
      }
      .material-card .download-icon {
        font-size: 1.2rem;
        transition: transform 0.1s;
      }
      .material-card:hover .download-icon {
        transform: translateX(2px);
      }
      .column {
        display: flex;
        flex-direction: column;
      }
      .lecture-list {
        flex: 1;
      }
    `;
    document.head.appendChild(styleTag);
  })();
</script>

<!-- 
  DESIGN EXPLANATION:
  - This layout implements exactly 2 columns: left for lectures (l1.pdf through l10.pdf)
  - Right column for solutions (l1s.pdf through l10s.pdf) as specified.
  - The "s" suffix indicates solutions (l1s.pdf = solutions week 1, etc.)
  - The materials are clearly labeled with Week badge and descriptive filename.
  - Hover effects, dark theme, and responsive grid maintain clarity.
  - All links open in new tab. No redundant content; perfectly aligned with the requirement.
  - The original design had many columns; this new version simplifies to two distinct categories.
-->
</body>
</html>
